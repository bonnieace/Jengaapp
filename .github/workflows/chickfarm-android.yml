name: ChickFarm Android
on:
  push:
    branches: [production-hardening]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build installable test APK
        run: flutter build apk --debug --build-name=1.1.0 --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ChickFarm-1.1.0-test
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
